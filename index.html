<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a5f">
<title>Verre liquide — compatible iOS</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffd22e; }
  body { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }

  /* Le canvas WebGL est la seule chose visible : fond + verre sont dessinés dedans.
     La page défile normalement grâce à #spacer, le canvas lit window.scrollY. */
  #gl {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
  }
  #spacer { width: 1px; }

  /* Zone tactile + libellé du verre (le rendu du verre lui-même est dans le shader). */
  #glass {
    position: fixed; left: 0; top: 0;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
    color: #fff;
    font: 700 16px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .01em;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .35);
    touch-action: none;
    cursor: grab;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    will-change: transform;
    outline: none;
  }
  #glass:active { cursor: grabbing; }
  #glass:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  /* Repli si WebGL est indisponible : verre flouté classique par-dessus la page. */
  html.no-gl #gl { display: none; }
  html.no-gl #page2d { position: absolute; top: 0; left: 0; display: block; }
  html.no-gl #glass {
    border-radius: 56px;
    border: 1px solid rgba(255, 255, 255, .55);
    background: rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(6px) saturate(1.4);
    backdrop-filter: blur(6px) saturate(1.4);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .6);
  }
</style>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="spacer"></div>
<div id="glass" role="button" tabindex="0" aria-label="Goutte de verre déplaçable">Appuie et glisse</div>

<script>
(() => {
  'use strict';

  /* ───────────── Réglages (tout se règle ici) ───────────── */
  const CONFIG = {
    glassW: 280,        // largeur du verre (px CSS)
    glassH: 176,        // hauteur du verre
    radius: 56,         // arrondi des coins
    band: 36,           // largeur de la bande de bord qui déforme fort
    refraction: 34,     // force de la déformation sur le bord (px)
    magnify: 0.07,      // léger grossissement au centre (0 = aucun)
    aberration: 0.07,   // séparation des couleurs sur les bords
    blur: 1.1,          // adoucissement (px)
    tint: 0.06,         // voile blanc sur le verre
    pressScale: 1.06,   // le verre grossit un peu quand on le touche
    follow: 0.3         // inertie du déplacement (0.1 = lent, 1 = instantané)
  };

  const COLORS = ['#ff5a5f', '#ffd22e', '#06e58a', '#4fcbfa'];
  const INK = '#14101f';
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  const COPY = [
    { h: true,  t: 'Le verre liquide, version iPhone.' },
    { t: 'Ces bandes de couleur sont derrière la goutte. Là où le verre s’arrondit, elles se plient comme vues à travers une goutte d’eau posée sur la page.' },
    { t: 'Fais défiler la page : les lettres glissent sous le verre et se déforment sur ses bords. Attrape la goutte avec le doigt pour la déplacer.' },
    { t: 'Tout est dessiné en WebGL, sans filtre SVG ni backdrop-filter. C’est pour ça que Safari sur iPhone sait l’afficher.' },
    { t: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.' },
    { t: 'Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.' },
    { t: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.' },
    { t: 'Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.' }
  ];

  /* ───────────── Éléments ───────────── */
  const root = document.documentElement;
  const glCanvas = document.getElementById('gl');
  const spacer = document.getElementById('spacer');
  const glassEl = document.getElementById('glass');

  /* ───────────── 1. Le fond : dessiné dans un canvas 2D ───────────── */
  function wrapLines(ctx, text, maxW) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  function buildPage(W, vh, maxTex, dpr) {
    const pad = Math.round(Math.min(28, W * 0.06));
    const body = Math.max(22, Math.min(30, Math.round(W / 18)));
    const head = Math.round(body * 1.7);
    const stripeW = Math.max(30, Math.round(W / 12));
    const targetH = Math.max(vh * 2.6, 1400);

    // 1) mise en page (mesures sur un canvas temporaire)
    const probe = document.createElement('canvas').getContext('2d');
    const blocks = [];
    let y = pad + 24, i = 0;
    while (y < targetH) {
      const item = COPY[i % COPY.length];
      if (item.h && i >= COPY.length) { i++; continue; }  // un seul titre, en haut
      const size = item.h ? head : body;
      const lh = Math.round(size * (item.h ? 1.08 : 1.22));
      probe.font = `${item.h ? 900 : 800} ${size}px ${FONT}`;
      const lines = wrapLines(probe, item.t, W - pad * 2);
      blocks.push({ lines, size, lh, weight: item.h ? 900 : 800, y });
      y += lines.length * lh + Math.round(size * (item.h ? 0.7 : 0.8));
      i++;
    }
    const H = Math.ceil(y + pad);

    // 2) échelle de la texture (limite GPU, 2x max)
    const scale = Math.min(dpr, 2, maxTex / H, maxTex / W);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * scale));
    c.height = Math.max(1, Math.round(H * scale));
    const ctx = c.getContext('2d');
    ctx.scale(c.width / W, c.height / H);

    // 3) bandes
    for (let x = 0, k = 0; x < W; x += stripeW, k++) {
      ctx.fillStyle = COLORS[k % COLORS.length];
      ctx.fillRect(x, 0, stripeW + 1, H);
    }
    // 4) texte
    ctx.fillStyle = INK;
    ctx.textBaseline = 'top';
    for (const b of blocks) {
      ctx.font = `${b.weight} ${b.size}px ${FONT}`;
      b.lines.forEach((ln, n) => ctx.fillText(ln, pad, b.y + n * b.lh));
    }
    return { canvas: c, W, H };
  }

  /* ───────────── 2. WebGL : fond + lentille de verre ───────────── */
  const VERT = `
    attribute vec2 a;
    void main(){ gl_Position = vec4(a, 0.0, 1.0); }
  `;

  const FRAG = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    uniform sampler2D uTex;
    uniform vec2  uBuf;      // taille du buffer (px device)
    uniform float uDpr;
    uniform float uScroll;   // window.scrollY (px CSS)
    uniform vec2  uPage;     // taille de la page (px CSS)
    uniform vec2  uCenter;   // centre du verre (px CSS, repère écran)
    uniform vec2  uHalf;     // demi-taille du verre
    uniform float uRadius;
    uniform float uBand;
    uniform float uRefract;
    uniform float uMagnify;
    uniform float uAberr;
    uniform float uBlur;
    uniform float uTint;

    float sdBox(vec2 p, vec2 b, float r){
      vec2 q = abs(p) - b + r;
      return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
    }

    vec3 bg(vec2 v){
      return texture2D(uTex, vec2(v.x, v.y + uScroll) / uPage).rgb;
    }

    vec3 soft(vec2 v, float r){
      vec3 c = bg(v) * 0.4;
      c += bg(v + vec2( r,  r)) * 0.15;
      c += bg(v + vec2(-r,  r)) * 0.15;
      c += bg(v + vec2( r, -r)) * 0.15;
      c += bg(v + vec2(-r, -r)) * 0.15;
      return c;
    }

    void main(){
      vec2 v = vec2(gl_FragCoord.x, uBuf.y - gl_FragCoord.y) / uDpr;
      vec3 base = bg(v);
      vec2 p = v - uCenter;

      // ombre portée douce
      float sds = sdBox(p - vec2(0.0, 12.0), uHalf, uRadius);
      base *= 1.0 - (1.0 - smoothstep(-6.0, 30.0, sds)) * 0.26;

      float sd = sdBox(p, uHalf, uRadius);
      if (sd > 1.0) { gl_FragColor = vec4(base, 1.0); return; }

      // normale du bord (gradient de la distance)
      vec2 g = vec2(
        sdBox(p + vec2(1.0, 0.0), uHalf, uRadius) - sdBox(p - vec2(1.0, 0.0), uHalf, uRadius),
        sdBox(p + vec2(0.0, 1.0), uHalf, uRadius) - sdBox(p - vec2(0.0, 1.0), uHalf, uRadius)
      );
      vec2 n = g / max(length(g), 0.0001);

      float depth = max(-sd, 0.0);
      float t = clamp(1.0 - depth / uBand, 0.0, 1.0);   // 1 au bord, 0 dans le cœur
      float disp = uRefract * t * t;

      // léger grossissement au centre + déformation forte sur le bord
      vec2 s = uCenter + p * (1.0 - uMagnify * (1.0 - t));
      float r = uBlur * (0.4 + t);
      vec2 d = n * disp;
      vec3 col = vec3(
        soft(s + d * (1.0 + uAberr), r).r,
        soft(s + d,                  r).g,
        soft(s + d * (1.0 - uAberr), r).b
      );

      // saturation + voile
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, 1.12);
      col = mix(col, vec3(1.0), uTint);
      col += 0.045 * (1.0 - smoothstep(-uHalf.y, uHalf.y * 0.2, p.y));

      // reflets de bord (lumière en haut à gauche)
      vec2 L = normalize(vec2(-0.55, -0.83));
      float rim = pow(t, 2.5);
      float s1 = pow(max(dot(n,  L), 0.0), 1.5);
      float s2 = pow(max(dot(n, -L), 0.0), 2.5);
      col += rim * (0.55 * s1 + 0.30 * s2 + 0.06);
      float ring = exp(-depth * depth / 1.2);
      col += ring * (0.18 + 0.5 * s1 + 0.2 * s2);

      float a = 1.0 - smoothstep(-0.75, 0.75, sd);
      gl_FragColor = vec4(mix(base, col, a), 1.0);
    }
  `;

  /* ───────────── État ───────────── */
  let gl = null, prog = null, tex = null, U = {};
  let page = null;                 // { canvas, W, H }
  let vw = 0, vh = 0, dpr = 1;
  let gw = CONFIG.glassW, gh = CONFIG.glassH;
  let px = 0, py = 0, tx = 0, ty = 0;   // position actuelle / cible du centre du verre
  let press = 0, pressT = 0;
  let dragging = false, offX = 0, offY = 0;
  let raf = 0;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  function initGL() {
    gl = glCanvas.getContext('webgl', { alpha: false, antialias: false, powerPreference: 'low-power' })
      || glCanvas.getContext('experimental-webgl');
    if (!gl) return false;
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    } catch (e) { console.error('Shader :', e); return false; }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    ['uTex','uBuf','uDpr','uScroll','uPage','uCenter','uHalf','uRadius','uBand',
     'uRefract','uMagnify','uAberr','uBlur','uTint'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
    return true;
  }

  function uploadTexture() {
    if (tex) gl.deleteTexture(tex);
    tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, page.canvas);
    // Texture de taille quelconque (NPOT) : pas de mipmap, bords bloqués → compatible WebGL1 / iOS.
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(U.uTex, 0);
  }

  /* ───────────── Rendu ───────────── */
  function draw() {
    const scrollY = window.pageYOffset || 0;

    // le libellé / la zone tactile suivent le verre
    const s = 1 + (CONFIG.pressScale - 1) * press;
    glassEl.style.transform = `translate3d(${px - gw / 2}px, ${py - gh / 2}px, 0) scale(${s})`;

    if (!gl) return;
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.uniform2f(U.uBuf, glCanvas.width, glCanvas.height);
    gl.uniform1f(U.uDpr, glCanvas.width / vw);
    gl.uniform1f(U.uScroll, scrollY);
    gl.uniform2f(U.uPage, page.W, page.H);
    gl.uniform2f(U.uCenter, px, py);
    gl.uniform2f(U.uHalf, (gw / 2) * s, (gh / 2) * s);
    gl.uniform1f(U.uRadius, Math.min(CONFIG.radius, gh / 2) * s);
    gl.uniform1f(U.uBand, CONFIG.band);
    gl.uniform1f(U.uRefract, CONFIG.refraction);
    gl.uniform1f(U.uMagnify, CONFIG.magnify);
    gl.uniform1f(U.uAberr, CONFIG.aberration);
    gl.uniform1f(U.uBlur, CONFIG.blur);
    gl.uniform1f(U.uTint, CONFIG.tint);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function tick() {
    raf = 0;
    const dx = tx - px, dy = ty - py;
    px += dx * CONFIG.follow;
    py += dy * CONFIG.follow;
    press += (pressT - press) * 0.22;
    draw();
    if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05 || Math.abs(pressT - press) > 0.003) request();
  }
  function request() { if (!raf) raf = requestAnimationFrame(tick); }

  /* ───────────── Taille / mise en place ───────────── */
  function clampTarget() {
    const mx = gw / 2 + 8, my = gh / 2 + 8;
    tx = Math.min(Math.max(tx, mx), vw - mx);
    ty = Math.min(Math.max(ty, my), vh - my);
  }

  function layout(rebuild) {
    vw = window.innerWidth;
    vh = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    gw = Math.min(CONFIG.glassW, vw - 40);
    gh = CONFIG.glassH;
    glassEl.style.width = gw + 'px';
    glassEl.style.height = gh + 'px';
    glassEl.style.borderRadius = Math.min(CONFIG.radius, gh / 2) + 'px';

    if (gl) {
      glCanvas.width = Math.round(vw * dpr);
      glCanvas.height = Math.round(vh * dpr);
    }
    if (rebuild || !page) {
      const maxTex = gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 4096;
      page = buildPage(vw, vh, maxTex, dpr);
      spacer.style.height = page.H + 'px';
      if (gl) uploadTexture();
      else { // repli : la page 2D est affichée telle quelle
        let c2 = document.getElementById('page2d');
        if (!c2) { c2 = page.canvas; c2.id = 'page2d'; document.body.insertBefore(c2, spacer); }
        else { c2.replaceWith(page.canvas); page.canvas.id = 'page2d'; }
        page.canvas.style.width = page.W + 'px';
        page.canvas.style.height = page.H + 'px';
      }
    }
    clampTarget();
    px = Math.min(Math.max(px, 0), vw); py = Math.min(Math.max(py, 0), vh);
    request();
  }

  /* ───────────── Glisser le verre (souris + doigt) ───────────── */
  glassEl.addEventListener('pointerdown', e => {
    dragging = true;
    pressT = 1;
    offX = e.clientX - px;
    offY = e.clientY - py;
    try { glassEl.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
    request();
  });
  glassEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    tx = e.clientX - offX;
    ty = e.clientY - offY;
    clampTarget();
    request();
  });
  const release = () => { dragging = false; pressT = 0; request(); };
  glassEl.addEventListener('pointerup', release);
  glassEl.addEventListener('pointercancel', release);

  // clavier (accessibilité) : flèches pour déplacer
  glassEl.addEventListener('keydown', e => {
    const step = e.shiftKey ? 60 : 20;
    const k = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!k) return;
    e.preventDefault();
    tx += k[0]; ty += k[1];
    clampTarget();
    request();
  });

  /* ───────────── Événements page ───────────── */
  window.addEventListener('scroll', request, { passive: true });

  let lastW = 0, resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const widthChanged = window.innerWidth !== lastW;   // la barre Safari change seulement la hauteur
      lastW = window.innerWidth;
      layout(widthChanged);
    }, 120);
  });

  glCanvas.addEventListener('webglcontextlost', e => e.preventDefault());
  glCanvas.addEventListener('webglcontextrestored', () => {
    if (initGL()) { uploadTexture(); request(); }
  });

  /* ───────────── Démarrage ───────────── */
  const ok = initGL();
  if (!ok) { gl = null; root.classList.add('no-gl'); }

  lastW = window.innerWidth;
  px = tx = window.innerWidth / 2;
  py = ty = window.innerHeight * 0.5;
  layout(true);
  // si la police système change la mise en page au chargement, on redessine une fois
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(true));
})();
</script>
</body>
</html>
